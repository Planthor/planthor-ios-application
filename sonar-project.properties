# SonarQube Cloud project settings for the Flutter application.
sonar.organization=planthor
sonar.projectKey=Planthor_planthor-ios-application
sonar.projectName=Planthor iOS Application

# Flutter application and test source boundaries.
sonar.sources=lib
sonar.tests=test
sonar.dart.lcov.reportPaths=coverage/lcov.info
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Generated providers and platform runner code are not maintained as Dart app code.
sonar.exclusions=**/*.g.dart
sonar.coverage.exclusions=**/*.g.dart
